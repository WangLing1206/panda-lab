<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PandaLab · 可视化 Pandas 数据分析</title>
<meta name="description" content="PandaLab — Visual pandas-style data analysis in your browser. 在浏览器中可视化完成 pandas 数据分析。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐼</text></svg>">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<!-- ══════════ 顶栏 Top bar ══════════ -->
<header class="topbar">
  <div class="brand">
    <span class="brand-logo">🐼</span>
    <span class="brand-name">PandaLab</span>
    <span class="brand-sub" data-i18n="app.subtitle">可视化 Pandas 数据分析</span>
  </div>

  <div class="topbar-center">
    <label class="fld-inline">
      <span data-i18n="tb.dataset">数据集</span>
      <select id="datasetSelect" class="select"></select>
    </label>
    <button id="btnUpload"  class="btn" data-i18n="tb.upload">📂 上传数据</button>
    <button id="btnExport"  class="btn" data-i18n="tb.export">⬇ 导出</button>
    <span class="topbar-sep"></span>
    <button id="btnUndo"  class="btn btn-icon" data-i18n-title="tb.undo"  title="撤销">↶</button>
    <button id="btnReset" class="btn btn-icon" data-i18n-title="tb.reset" title="重置">⟲</button>
  </div>

  <div class="topbar-right">
    <button id="btnTheme" class="btn btn-icon" title="Theme" aria-label="theme">🌙</button>
    <button id="btnLang"  class="btn btn-lang">EN</button>
  </div>
</header>

<div class="layout">

  <!-- ══════════ 左侧操作菜单 ══════════ -->
  <aside class="sidebar" id="sidebar">
    <nav id="opMenu" class="op-menu"><!-- JS 渲染 --></nav>
  </aside>

  <!-- ══════════ 主区域 ══════════ -->
  <main class="main" id="mainArea">

    <!-- 流水线步骤条 -->
    <div class="pipeline-bar" id="pipelineBar">
      <span class="pipeline-label" data-i18n="pipe.label">操作流水线</span>
      <div class="pipeline-chips" id="pipelineChips"></div>
    </div>

    <!-- 页签 -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="table" data-i18n="tab.table">数据表</button>
      <button class="tab-btn" data-tab="chart" data-i18n="tab.chart">图表</button>
      <button class="tab-btn" data-tab="code"  data-i18n="tab.code">pandas 代码</button>
      <div class="tab-actions">
        <button id="btnInfo"     class="btn btn-sm" data-i18n="tab.info">信息 info()</button>
        <button id="btnDescribe" class="btn btn-sm" data-i18n="tab.describe">统计 describe()</button>
      </div>
    </div>

    <!-- 数据表页签 -->
    <section id="tabTable" class="tab-panel active">
      <div class="table-wrap" id="tableWrap">
        <table id="dataTable" class="data-table"></table>
      </div>
      <div class="pager">
        <button id="btnPrev" class="btn btn-sm">‹ <span data-i18n="pager.prev">上一页</span></button>
        <span id="pageInfo" class="pager-info"></span>
        <button id="btnNext" class="btn btn-sm"><span data-i18n="pager.next">下一页</span> ›</button>
        <select id="pageSize" class="select select-sm">
          <option value="25">25</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="200">200</option>
        </select>
      </div>
    </section>

    <!-- 图表页签 -->
    <section id="tabChart" class="tab-panel">
      <div class="chart-controls" id="chartControls"><!-- JS 渲染 --></div>
      <div class="chart-canvas-wrap">
        <div id="chartCanvas" class="chart-canvas"></div>
        <div id="chartEmpty" class="chart-empty" data-i18n="chart.empty">请选择图表类型与字段后点击「绘制」</div>
      </div>
    </section>

    <!-- 代码页签 -->
    <section id="tabCode" class="tab-panel">
      <div class="code-toolbar">
        <span class="code-title">Python · pandas</span>
        <button id="btnCopyCode" class="btn btn-sm" data-i18n="code.copy">📋 复制代码</button>
      </div>
      <pre class="code-view"><code id="codeView"></code></pre>
    </section>
  </main>

  <!-- ══════════ 右侧操作配置面板 ══════════ -->
  <aside class="op-panel" id="opPanel">
    <div class="op-panel-head">
      <div>
        <div class="op-panel-title" id="panelTitle"></div>
        <div class="op-panel-sub" id="panelSub"></div>
      </div>
      <button class="btn btn-icon" id="panelClose">✕</button>
    </div>
    <div class="op-panel-body" id="panelBody"><!-- JS 渲染表单 --></div>
    <div class="op-panel-foot">
      <button class="btn btn-primary" id="panelApply"  data-i18n="panel.apply">应用操作</button>
      <button class="btn"             id="panelCancel" data-i18n="panel.cancel">取消</button>
    </div>
  </aside>
</div>

<!-- ══════════ 底部状态栏 ══════════ -->
<footer class="statusbar">
  <span id="statusShape"></span>
  <span class="statusbar-sep">·</span>
  <span id="statusNulls"></span>
  <span class="statusbar-sep">·</span>
  <span id="statusSource"></span>
  <span class="statusbar-right" id="statusHint" data-i18n="status.hint">点击左侧菜单开始分析 ✨</span>
</footer>

<!-- ══════════ 通用模态框 ══════════ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-head">
      <span id="modalTitle"></span>
      <button class="btn btn-icon" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div class="drop-mask" id="dropMask"><div class="drop-mask-inner" data-i18n="drop.hint">松开以加载文件 📄</div></div>

<script src="js/i18n.js"></script>
<script src="js/dataframe.js"></script>
<script src="js/datasets.js"></script>
<script src="js/pandasgen.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
